<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="style.css" rel="stylesheet">
  <title>Akan Name Geneerator</title>
</head>

<body>
  <header class="website-header">
    <nav class="main-nav">
      <a href="#hero-section">Home</a>
      <a href="#name-generator">Generator</a>
      <a href="#your-name">Your Name</a>
    </nav>
  </header>

  <section id="hero-section">
    <div class="hero">
      <h1> Akan Name Generator</h1>
      <p>Discover your traditional AKn name based on the day of the week you were born.</p>
    </div>
  </section>

  <section id="name-generator">
    <section class="form-section">
      <h2> Enter your birthday</h2>
      <h3>Date of Birth</h3>
      <form id="akanForm">
        <div class="input-group">
          <label for="day">Day</label>
          <input type="number" id="day" placeholder="DD" min="1" max="31" required>
        </div>

        <div class="input-group">
          <label for="month">Month</label>
          <input type="number" id="month" placeholder="MM" min="1" max="12" required>
        </div>

        <div class="input-group">
          <label for="year">Year</label>
          <input type="number" id="year" placeholder="YYYY" required>
        </div>

        <div class="gender">
          <p> Select Gender</p>
          <label>
            <input type="radio" name="gender" value="male">
            Male
          </label>

          <label type="radio" name="gender" value="female">
            Female
          </label>
        </div>

        <button type="submit">Generate Akan Name</button>
      </form>

    </section>
  </section>


  <section id="your-name">
    <h2>Your Akan Name</h2>
    <p id="output">Your results will appear here</p>

  </section>

  <footer>
    <p>© 2026 Akan Name Generator</p>
  </footer>

  </section>

  <script src="script.js"></script>
</body>

</html>
